name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests and journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache containerized Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('app/gradle/wrapper/gradle-wrapper.properties', 'app/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: Validate Compose configuration
        run: |
          just compose --profile tools config --quiet
          just compose -f compose.test.yaml --profile tools config --quiet

      - name: Run complete verification
        run: just ci

      - name: Collect container logs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p evidence/ci
          just compose logs --no-color > evidence/ci/services.log 2>&1
          just compose -f compose.test.yaml logs --no-color > evidence/ci/test-db.log 2>&1

      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            evidence/
            pricer/evidence/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop application containers
        if: always()
        run: just down

      - name: Remove test database
        if: always()
        run: just test-db-down

  publish:
    name: Publish ${{ matrix.service }}
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [app, pricer]
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select image repository
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ matrix.service }}

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and publish tested revision
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
