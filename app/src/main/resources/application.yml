server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/lab}
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:lab-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
lab:
  pricer-url: ${PRICER_URL:http://localhost:8090}
  pricer-timeout-ms: ${PRICER_TIMEOUT_MS:15000}
  terms-directory: ${TERMS_DIRECTORY:../fixtures/terms}
  fault-injection: ${FAULT_INJECTION:false}
